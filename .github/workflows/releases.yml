name: Verificar y publicar instaladores
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar y verificar (por ejemplo 1.2.0)'
        required: true
        type: string
      publicar:
        description: 'Publicar release después de las pruebas; desactivado conserva solo instaladores y evidencias'
        required: true
        type: boolean
        default: false
      solo_windows:
        description: 'Verificar solo Windows para una entrega de prueba (sin release pública)'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: falcon-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.solo_windows && '[{"os":"windows-latest","plataforma":"win-x64","script":"release:win"}]' || '[{"os":"windows-latest","plataforma":"win-x64","script":"release:win"},{"os":"ubuntu-24.04","plataforma":"linux-x64","script":"release:linux"},{"os":"ubuntu-24.04-arm","plataforma":"linux-arm64","script":"release:linux-arm"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # El repositorio histórico contiene node_modules. Se instala desde el lockfile.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /recursos/
            /herramientas/
            /pruebas/
            /notas/
            /package.json
            /package-lock.json
            /electron-builder.config.cjs
            /LICENSE
            /THIRD_PARTY_NOTICES.md
            /.gitattributes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validar versión solicitada
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json'), l=require('./package-lock.json'); if(process.env.RELEASE_VERSION!==p.version || !/^\d+\.\d+\.\d+$/.test(p.version) || l.version!==p.version || l.packages[''].version!==p.version) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run test:actualizaciones
      - name: Compilar sin publicar
        run: npm run ${{ matrix.script }} -- --publish never
      - name: Instalar y probar todas las plantillas con Electron real
        run: node herramientas/probar-instalado.cjs
      - name: Conservar evidencias de las pruebas del instalador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-instalador-${{ matrix.plataforma }}
          path: pruebas-instalador/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.plataforma }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist-actualizaciones/*.exe
            dist-actualizaciones/*.AppImage
            dist-actualizaciones/*.blockmap
            dist-actualizaciones/latest*.yml
  publicar:
    if: ${{ inputs.publicar && !inputs.solo_windows }}
    needs: compilar
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /herramientas/
            /notas/
            /package.json
            /package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: instaladores-*
          path: instaladores
          merge-multiple: true
      - name: Verificar todos los instaladores, metadatos y hashes
        run: node herramientas/verificar-release.cjs instaladores
      - name: Subir a borrador y publicar solo al completar los tres sistemas
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: node herramientas/publicar-release.cjs
