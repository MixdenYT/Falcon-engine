name: Validar física 3D en Ara

on:
  push:
    branches:
      - codex/fisica3d-ara
      - codex/control3d-ara
      - codex/camara3d-ara

permissions:
  contents: write

concurrency:
  group: falcon-ara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compilar el núcleo WebAssembly desde los módulos Ara
        run: node herramientas/compilar-nucleo-ara.mjs
      - name: Verificar que el binario corresponde a las fuentes Ara
        run: node herramientas/compilar-nucleo-ara.mjs --comprobar
      - name: Ejecutar todas las pruebas del motor
        run: npm test
      - name: Verificar actualizaciones
        run: npm run test:actualizaciones
      - name: Guardar el núcleo WebAssembly regenerado en esta rama
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Si llegó otro commit mientras se ejecutaban las pruebas, reconstruir sobre la punta
          # actual; nunca publicar un wasm compilado contra fuentes antiguas.
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            git reset --hard FETCH_HEAD
            node herramientas/compilar-nucleo-ara.mjs
            node herramientas/compilar-nucleo-ara.mjs --comprobar
            npm test
            npm run test:actualizaciones
          fi

          if ! git diff --quiet -- src/motor/ara/nucleo.wasm; then
            git add src/motor/ara/nucleo.wasm
            git commit -m "build(ara): regenerar núcleo WebAssembly desde Ara"
            if ! git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              # Una última carrera de escritura no debe dejar un binario obsoleto.
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard FETCH_HEAD
              node herramientas/compilar-nucleo-ara.mjs
              node herramientas/compilar-nucleo-ara.mjs --comprobar
              npm test
              npm run test:actualizaciones
              if ! git diff --quiet -- src/motor/ara/nucleo.wasm; then
                git add src/motor/ara/nucleo.wasm
                git commit -m "build(ara): regenerar núcleo WebAssembly desde Ara"
                git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
              fi
            fi
          fi
