name: Verificar gestor y actualizaciones
on:
  pull_request:
    paths:
      - 'src/gestor/**'
      - 'src/motor/**'
      - 'src/aguila/**'
      - 'src/principal/**'
      - 'pruebas/**'
      - 'herramientas/**'
      - 'package*.json'
      - 'electron-builder.config.cjs'
      - '.github/workflows/verificar-actualizaciones.yml'
      - '.github/workflows/releases.yml'
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:actualizaciones
      - name: Validar configuración de paquetes
        run: node -e "require('app-builder-lib/out/util/config/config').validateConfiguration(require('./electron-builder.config.cjs'), require('electron-builder/package.json').version).catch(e => { console.error(e); process.exit(1); })"
      - name: Instalar Chromium para pruebas WebGL
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Instalar Playwright Core
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Probar renderizado 3D real con WebGL
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node pruebas/webgl.test.mjs
